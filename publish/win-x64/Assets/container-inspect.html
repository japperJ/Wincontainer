<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Container Inspect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.5;
  padding: 16px;
  background: var(--bg, #0d1117);
  color: var(--text, #e6edf3);
}
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.toolbar button {
  background: #21262d;
  border: 1px solid #30363d;
  color: #e6edf3;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.toolbar button:hover { background: #30363d; }
.toolbar button.copied { background: #238636; border-color: #2ea043; }
#container {
  overflow: auto;
  max-height: calc(100vh - 60px);
}
#container pre {
  margin: 0;
  padding: 0;
  background: transparent;
}
#container code {
  background: transparent;
  padding: 0;
}
</style>
</head>
<body>
<div class="toolbar">
  <button id="copyBtn" onclick="copyJson()">Copy JSON</button>
  <span id="status" style="font-size:12px;color:#8b949e;"></span>
</div>
<div id="container">
  <pre><code id="jsonContent" class="language-json"></code></pre>
</div>
<script>
let rawJson = '';

function setJson(json) {
  rawJson = json;
  try {
    const parsed = JSON.parse(json);
    const formatted = JSON.stringify(parsed, null, 2);
    document.getElementById('jsonContent').textContent = formatted;
    document.getElementById('status').textContent =
      `Keys: ${Object.keys(parsed).length} | Size: ${formatted.length} chars`;
    hljs.highlightElement(document.getElementById('jsonContent'));
  } catch {
    document.getElementById('jsonContent').textContent = json;
    document.getElementById('status').textContent = 'Invalid JSON';
  }
}

function copyJson() {
  const btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(rawJson).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy JSON'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</body>
</html>
